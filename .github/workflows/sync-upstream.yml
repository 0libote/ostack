name: Sync upstream skills and plugins

on:
  workflow_dispatch:
  schedule:
    # Mondays 09:00 UTC — keeps the copy fresh without noise.
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write # manage sync/upstream labels

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test upstream merge safety
        run: python3 -m unittest discover -s tests -p 'test_sync_upstream.py'

      - name: Sync each upstream skill and plugin (one PR per item)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT (classic, repo + workflow scopes) used when the
          # repo setting "Allow GitHub Actions to create and approve pull
          # requests" is off. The script prefers it when set.
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git config user.name "0libote"
          git config user.email "79215282+0libote@users.noreply.github.com"
          bash .github/scripts/sync-upstream.sh
